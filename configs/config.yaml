server:
  port: "8080"
  host: "0.0.0.0"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "notification_service"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

redis:
  addresses:
    - "localhost:6379"
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10

kafka:
  brokers:
    - "localhost:9092"
  topic: "notifications"
  group_id: "notification-service"
  security: ""

channels:
  email:
    providers:
      - name: "sendgrid"
        priority: 1
        enabled: true
        config:
          api_key: ""
        rate_limit:
          requests_per_second: 100
          burst: 200
        circuit_breaker:
          failure_threshold: 5
          success_threshold: 2
          timeout: "30s"
      - name: "ses"
        priority: 2
        enabled: true
        config:
          access_key: ""
          secret_key: ""
          region: "us-east-1"
        rate_limit:
          requests_per_second: 200
          burst: 400
        circuit_breaker:
          failure_threshold: 5
          success_threshold: 2
          timeout: "30s"
      - name: "mailgun"
        priority: 3
        enabled: false
        config:
          api_key: ""
          domain: ""
        rate_limit:
          requests_per_second: 100
          burst: 200
        circuit_breaker:
          failure_threshold: 5
          success_threshold: 2
          timeout: "30s"
    default_provider: "sendgrid"

  sms:
    providers:
      - name: "twilio"
        priority: 1
        enabled: true
        config:
          account_sid: ""
          auth_token: ""
          from_number: ""
        rate_limit:
          requests_per_second: 50
          burst: 100
        circuit_breaker:
          failure_threshold: 5
          success_threshold: 2
          timeout: "30s"
      - name: "plivo"
        priority: 2
        enabled: true
        config:
          auth_id: ""
          auth_token: ""
          from_number: ""
        rate_limit:
          requests_per_second: 50
          burst: 100
        circuit_breaker:
          failure_threshold: 5
          success_threshold: 2
          timeout: "30s"
      - name: "vonage"
        priority: 3
        enabled: false
        config:
          api_key: ""
          api_secret: ""
          from_number: ""
        rate_limit:
          requests_per_second: 50
          burst: 100
        circuit_breaker:
          failure_threshold: 5
          success_threshold: 2
          timeout: "30s"
    default_provider: "twilio"

  push:
    apns:
      key_id: ""
      team_id: ""
      bundle_id: ""
      private_key: ""
      production: false
    fcm:
      server_key: ""
      project_id: ""

  in_app:
    websocket_port: 8081
    max_connections: 10000

  webhook:
    timeout: "10s"
    retries: 3

  voice:
    providers:
      - name: "twilio"
        priority: 1
        enabled: true
        config:
          account_sid: ""
          auth_token: ""
          from_number: ""
        rate_limit:
          requests_per_second: 10
          burst: 20
        circuit_breaker:
          failure_threshold: 5
          success_threshold: 2
          timeout: "30s"
      - name: "vonage"
        priority: 2
        enabled: false
        config:
          api_key: ""
          api_secret: ""
          from_number: ""
        rate_limit:
          requests_per_second: 10
          burst: 20
        circuit_breaker:
          failure_threshold: 5
          success_threshold: 2
          timeout: "30s"
      - name: "plivo"
        priority: 3
        enabled: false
        config:
          auth_id: ""
          auth_token: ""
          from_number: ""
        rate_limit:
          requests_per_second: 10
          burst: 20
        circuit_breaker:
          failure_threshold: 5
          success_threshold: 2
          timeout: "30s"
    default_provider: "twilio"

routing:
  tiers:
    - name: "critical"
      priority: 1
      channels: ["sms", "push", "voice"]
      rate_limit:
        requests_per_second: 1000
        burst: 2000
    - name: "high"
      priority: 2
      channels: ["push", "sms", "email"]
      rate_limit:
        requests_per_second: 500
        burst: 1000
    - name: "normal"
      priority: 3
      channels: ["email", "in_app", "webhook"]
      rate_limit:
        requests_per_second: 200
        burst: 500
    - name: "low"
      priority: 4
      channels: ["email", "in_app", "webhook"]
      rate_limit:
        requests_per_second: 50
        burst: 100

  fallback_rules:
    - from_channel: "in_app"
      to_channel: "push"
      delay: "5m"
      condition: "unread"
    - from_channel: "push"
      to_channel: "sms"
      delay: "10m"
      condition: "failed"
    - from_channel: "email"
      to_channel: "sms"
      delay: "30m"
      condition: "bounced"

processing:
  digest_enabled: true
  digest_window: "5m"
  max_digest_size: 50
  bulk_chunk_size: 1000
  idempotency_ttl: "24h"

reliability:
  retry_policy:
    max_retries: 3
    initial_delay: "1s"
    max_delay: "30s"
    multiplier: 2.0
    retryable_errors:
      - "timeout"
      - "connection refused"
      - "temporary failure"
      - "rate limit"
  dlq:
    max_retries: 5
    retention: "168h"
  rate_limiter:
    global_rate_limit: 10000
    per_channel_limit:
      email: 500
      sms: 100
      push: 1000
      in_app: 2000
      webhook: 200
      voice: 20

analytics:
  enabled: true
  event_topic: "notification_events"
  retention_days: 30
  audit_enabled: true
  kafka_brokers:
    - "localhost:9092"